name: Gerar APK Android (debug)

# Acionável pelo celular: GitHub > Actions > "Gerar APK Android (debug)" > Run workflow.
# O APK fica em "Artifacts" na página da execução.
# Veja docs/ANDROID_BUILD.md para o estado real da última execução.

on:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar componentes do Android SDK (SDK já vem no runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Baixar Godot e templates de exportação
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d tpl
          cp -r tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Keystore de debug (gerada na hora, nunca versionada)
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configurar caminhos do Android no Godot
        run: |
          "$GODOT" --headless --path client --import || true
          cfg="$(ls "$HOME"/.config/godot/editor_settings-4*.tres 2>/dev/null | head -1)"
          if [ -z "$cfg" ]; then
            mkdir -p "$HOME/.config/godot"
            cfg="$HOME/.config/godot/editor_settings-4.tres"
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$cfg"
          fi
          {
            echo 'export/android/android_sdk_path = "'"$ANDROID_HOME"'"'
            echo 'export/android/java_sdk_path = "'"$JAVA_HOME"'"'
          } >> "$cfg"

      - name: Exportar APK
        run: |
          mkdir -p build
          "$GODOT" --headless --path client --export-debug "Android (debug)" ../build/cronicas-do-eclipse-debug.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: cronicas-do-eclipse-apk-debug
          path: build/cronicas-do-eclipse-debug.apk
          if-no-files-found: error
